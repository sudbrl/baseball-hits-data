name: Fetch and Update Baseball Data
on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Verify Python
      - name: Verify Python
        run: |
          echo "Running baseball data workflow"
          python --version
          python -c "import urllib.request; print('urllib is working')"

      # 4. Fetch baseball data
      - name: Fetch baseball data
        run: |
          python -c "
          import urllib.request
          import urllib.error
          import json
          import os
          import sys

          url = 'https://api.sampleapis.com/baseball/hitsSingleSeason'
          print('Fetching baseball data...')
          print('URL:', url)

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  raw = response.read().decode('utf-8')
                  data = json.loads(raw)
          except urllib.error.URLError as e:
              print(f'ERROR: Failed to fetch data: {e}')
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f'ERROR: Failed to parse JSON response: {e}')
              sys.exit(1)

          if not isinstance(data, list):
              print(f'ERROR: Expected a list, got {type(data).__name__}. Response: {str(data)[:200]}')
              sys.exit(1)

          print('Data successfully downloaded')

          # Create data directory
          os.makedirs('data', exist_ok=True)

          # Output file
          filename = 'data/baseball-hits.json'

          # Save JSON
          with open(filename, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f'Data fetched and saved to {filename}')
          print(f'Total records: {len(data)}')
          "

      # 5. Check generated file
      - name: Check generated data
        run: |
          echo "Checking generated file..."
          ls -lh data/
          echo "First 20 lines:"
          head -20 data/baseball-hits.json

      # 6. Commit and push changes
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/baseball-hits.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update baseball hits data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
