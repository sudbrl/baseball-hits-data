name: Fetch and Update Baseball Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify workflow
        run: |
          echo "=== Python ==="
          python --version

          echo "=== Workflow files ==="
          find .github/workflows -type f -maxdepth 1 -print

          echo "=== Search for requests ==="
          grep -Rni "import requests\|requests.get\|pip install requests" .github/workflows || true

          echo "=== Search entire repository ==="
          grep -Rni "import requests" . --exclude-dir=.git || true

      - name: Fetch baseball data
        run: |
          python -c "
          import urllib.request
          import json
          import os

          url = 'https://api.sampleapis.com/baseball/hitsSingleSeason'

          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.loads(response.read().decode('utf-8'))

          os.makedirs('data', exist_ok=True)

          filename = 'data/baseball-hits.json'

          with open(filename, 'w') as f:
              json.dump(data, f, indent=2)

          print(f'Data fetched and saved to {filename}')
          print(f'Total records: {len(data)}')
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/baseball-hits.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update baseball hits data"
            git push
          fi
